name: Android derleme
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  derle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Projeyi ac
        run: unzip -o proje.zip -d .
      - name: Java 17 ve Gradle hazirla
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle-8.14.3-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.14.3/bin" >> "$GITHUB_PATH"
      - name: Ortam bilgisi
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Deneme APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: deneme-apk
          path: app/build/outputs/apk/debug/*.apk
